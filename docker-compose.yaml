
services:
  postgres:
    image: postgres:16
    container_name: warehouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  service-api:
    build:
      context: ./service-api
    depends_on:
    - service-warehouse
    container_name: service-api
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      WAREHOUSE_URL: http://service-warehouse:9080
  service-warehouse:
    build:
      context: ./service-warehouse
    depends_on:
    - postgres
    container_name: service-warehouse
    ports:
      - "9080:9080"
    environment:
      HTTP_PORT: "9080"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: warehouse
  zookeeper:
    image: quay.io/debezium/zookeeper:3.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
  kafka:
    image: quay.io/debezium/kafka:3.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      ZOOKEEPER_CONNECT: zookeeper:2181
      ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      BROKER_ID: 1
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  connect:
    image: quay.io/debezium/connect:3.1
    container_name: connect
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
volumes:
  postgres_data: